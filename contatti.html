<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;700&family=Montserrat:wght@400;600&display=swap"
          rel="stylesheet">

    <title>Contatti - Viaggi Del Gusto</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contattaci per info e suggerimenti" />
    <link rel="icon" type="image/jpg" sizes="32x32" href="img/logo_progetto.jpg" />
    <link rel="stylesheet" href="css/style.css" />

</head>

<!--Nav bar-->
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="img/logo_progetto.jpg" alt="logo"/>
                <h2>Viaggi del gusto </h2>
            </div>


            <div class="linkNav">
                <a href="index.html">Home</a>
                <a href="contatti.html">Contatti</a>
                <a href="chi_siamo.html">Chi siamo</a>
                <a href="eventi.html">Eventi</a>
                <a href="glossario.html">Glossario</a>
            </div>

        </nav>

    </header>

    <!--Sezione dedicata agli input-->
    <main>
        <div class="container">
            <div class="formcontatto">
                <div>
                    <h1>Per segnalare qualsiasi problema compila il form</h1>
                </div>
                <form action="#" method="post">
                    <label for="nome">Nome e Cognome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Inserisci nome e cognome" required />

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Inserisci email" required />

                    <label for="messaggio">Scrivi il tuo messaggio:</label>
                    <textarea id="messaggio" name="messaggio" rows="5" placeholder="Inserisci il testo" required></textarea>

                    <button type="submit" class="button-1">Invia</button> <!--Serve per il pulsante d'invio'-->
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="logoFooter">
            <img src="img/logo_bitcamp.png" width="100" height="100" alt="Logo Bitcamp" />
            <img src="img/logo_ministero.png" width="100" height="100" alt="Logo Ministero" />
            <img src="img/logo_ente.png" width="100" height="100" alt="Logo Ente" />
        </div>
        <p>&copy; 2025 Ministero del Turismo e delle Attività Culturali. Tutti i diritti riservati</p>
    </footer>

</body>
</html>
